<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Big Screen Lab</title>
  <!-- Parámetro ?v=2 para obligar al navegador a no usar estilos viejos -->
  <link rel="stylesheet" href="style.css?v=2">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap">
</head>
<body>
  <!-- Barra Superior -->
  <header class="navbar">
    <div class="logo">
      <svg class="logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="3" width="20" height="14" rx="3" />
        <polygon points="10 8 15 10 10 12 10 8" fill="currentColor" stroke="none" />
        <path d="M8 21h8" />
        <path d="M12 17v4" />
      </svg>
      <span class="logo-white">BIG</span><span class="logo-accent">SCREEN</span>
    </div>
    
    <div class="search-box">
      <input type="text" id="search-input" placeholder="Buscar por título..." autocomplete="off">
    </div>

    <div class="filters">
      <button class="filter-btn active" data-filter="all">Todos</button>
      <button class="filter-btn" data-filter="pelicula">Películas</button>
      <button class="filter-btn" data-filter="serie">Series</button>
      <button class="filter-btn" data-filter="anime">Anime</button>
      <button class="filter-btn" data-filter="favoritos">⭐ Mi Lista</button>
    </div>
  </header>

  <!-- Hero Banner TMDB -->
  <section id="hero-banner" class="hero-banner"></section>

  <!-- Catálogo -->
  <main class="container">
    <section class="catalog-grid" id="catalog-grid"></section>
  </main>

  <!-- Modal Reproductor -->
  <div class="modal-overlay" id="modal-overlay" style="display: none;">
    <div class="modal">
      <button class="close-btn" id="close-modal">&times;</button>
      <div id="modal-body"></div>
    </div>
  </div>

  <script src="app.js?v=2"></script>
</body>
</html>

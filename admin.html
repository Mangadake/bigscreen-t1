<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Administración - StreamLab</title>
  <link rel="stylesheet" href="style.css?v=2">
  <style>
    .admin-container {
      max-width: 820px;
      margin: 2rem auto;
      padding: 1.5rem;
      background: var(--bg-card);
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .form-group {
      margin-bottom: 1.2rem;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }
    .form-group label {
      font-size: 0.85rem;
      color: var(--text-secondary);
      font-weight: 600;
    }
    .form-group input, .form-group select {
      padding: 0.75rem 1rem;
      background: #1f232b;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 6px;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
    }
    .form-group input:focus, .form-group select:focus {
      border-color: var(--accent);
    }
    .btn-action {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 0.8rem 1.5rem;
      border-radius: 6px;
      font-weight: 700;
      cursor: pointer;
      width: 100%;
      font-size: 0.95rem;
      transition: opacity 0.2s, background-color 0.2s;
    }
    .btn-action:hover {
      background: #b80710;
    }
    .preview-card {
      margin-top: 1.5rem;
      padding: 1.2rem;
      background: #11141a;
      border-radius: 8px;
      display: none;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .status-msg {
      margin-top: 1rem;
      font-size: 0.9rem;
      text-align: center;
      font-weight: 600;
    }
    .catalog-explorer {
      margin: 1.8rem 0;
      padding: 1.2rem;
      background: #11141a;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .explorer-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
      flex-wrap: wrap;
      gap: 0.5rem;
    }
    .explorer-header h3 {
      font-size: 1.05rem;
      color: #fff;
    }
    .explorer-tabs {
      display: flex;
      gap: 0.4rem;
      flex-wrap: wrap;
    }
    .tab-btn {
      background: #1f232b;
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: var(--text-secondary);
      padding: 0.35rem 0.75rem;
      border-radius: 4px;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .tab-btn:hover, .tab-btn.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }
    .explorer-search-row {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }
    .explorer-search-row input {
      flex: 1;
      padding: 0.6rem 0.9rem;
      background: #1f232b;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 6px;
      color: #fff;
      font-size: 0.9rem;
      outline: none;
    }
    .explorer-search-row button {
      padding: 0.6rem 1.2rem;
      background: #374151;
      border: none;
      color: #fff;
      font-size: 0.85rem;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
    }
    .explorer-search-row button:hover {
      background: #4b5563;
    }
    .explorer-results {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 0.8rem;
      max-height: 380px;
      overflow-y: auto;
      padding-right: 4px;
    }
    .explorer-item {
      background: #181b22;
      border-radius: 6px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      border: 1px solid rgba(255, 255, 255, 0.05);
      position: relative;
    }
    .explorer-item img {
      width: 100%;
      aspect-ratio: 2 / 3;
      object-fit: cover;
    }
    .explorer-item-info {
      padding: 0.5rem;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
      justify-content: space-between;
    }
    .explorer-item-title {
      font-size: 0.78rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 0.3rem;
    }
    .explorer-item-meta {
      font-size: 0.7rem;
      color: var(--text-secondary);
      margin-bottom: 0.5rem;
    }
    .btn-inspect {
      background: #2563eb;
      color: #fff;
      border: none;
      padding: 0.35rem 0.5rem;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      transition: background-color 0.2s;
    }
    .btn-inspect:hover {
      background: #1d4ed8;
    }
    .stream-checker-box {
      margin-top: 1.2rem;
      padding-top: 1.2rem;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }
    .checker-title {
      font-size: 0.9rem;
      font-weight: 700;
      color: #60a5fa;
      margin-bottom: 0.5rem;
    }
    .checker-frame-container {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 6px;
      overflow: hidden;
      margin-top: 0.5rem;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }
    .checker-frame-container iframe {
      width: 100%;
      height: 100%;
      border: 0;
    }
    .catalog-manager {
      margin-top: 2.5rem;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      padding-top: 1.5rem;
    }
    .catalog-manager h3 {
      font-size: 1.15rem;
      margin-bottom: 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .manage-list {
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
      max-height: 480px;
      overflow-y: auto;
      padding-right: 4px;
    }
    .manage-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #11141a;
      padding: 0.7rem 0.9rem;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      gap: 0.8rem;
    }
    .manage-item-info {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      flex: 1;
    }
    .manage-item-info img {
      width: 42px;
      height: 62px;
      object-fit: cover;
      border-radius: 4px;
      flex-shrink: 0;
    }
    .manage-item-text {
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
      flex: 1;
    }
    .manage-item-text h4 {
      font-size: 0.9rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 380px;
    }
    .manage-item-text span {
      font-size: 0.75rem;
      color: var(--text-secondary);
      text-transform: uppercase;
    }
    .manage-quality-row {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      margin-top: 0.2rem;
    }
    .manage-quality-row select {
      background: #1f232b;
      border: 1px solid rgba(255, 255, 255, 0.18);
      color: #fff;
      font-size: 0.75rem;
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      outline: none;
    }

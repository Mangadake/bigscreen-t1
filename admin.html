<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BigScreen - Panel de Administración</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap">
  <style>
    :root {
      --bg: #0b0d12;
      --card: #151821;
      --card-inner: #1c202c;
      --border: rgba(255, 255, 255, 0.08);
      --accent: #e50914;
      --accent-hover: #b80710;
      --text: #f3f4f6;
      --text-muted: #9ca3af;
      --blue: #2563eb;
      --purple: #9333ea;
      --green: #059669;
      --orange: #d97706;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 1.5rem 2rem;
    }

    .admin-wrapper {
      max-width: 1750px;
      margin: 0 auto;
    }

    /* TOP BAR */
    .admin-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.5rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
      gap: 1rem;
    }

    .admin-title h1 {
      font-size: 1.6rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .admin-title p {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 0.2rem;
    }

    .btn-config {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.5rem 1rem;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.85rem;
      transition: all 0.2s;
    }

    .btn-config:hover { background: rgba(255, 255, 255, 0.15); }

    /* MODAL CONFIG ACCESO */
    .config-panel {
      display: none;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1.25rem;
      margin-bottom: 1.5rem;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1rem;
    }

    .config-panel.open { display: grid; }
    .config-group label { display: block; font-size: 0.75rem; color: var(--text-muted); margin-bottom: 0.3rem; font-weight: 700; text-transform: uppercase; }
    .config-group input { width: 100%; background: var(--card-inner); border: 1px solid var(--border); border-radius: 6px; padding: 0.55rem 0.8rem; color: #fff; font-size: 0.85rem; outline: none; }
    .config-group input:focus { border-color: var(--accent); }

    /* LAYOUT WIDESCREEN A DOS COLUMNAS */
    .dashboard-grid {
      display: grid;
      grid-template-columns: 1.2fr 0.8fr;
      gap: 2rem;
      align-items: start;
    }

    @media (max-width: 1200px) {
      .dashboard-grid { grid-template-columns: 1fr; }
    }

    .panel-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1.4rem;
      margin-bottom: 1.8rem;
    }

    .panel-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.2rem;
      flex-wrap: wrap;
      gap: 0.8rem;
    }

    .panel-card-title {
      font-size: 1.15rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    /* EXPLORADOR TMDB */
    .tmdb-nav-pills {
      display: flex;
      gap: 0.4rem;
      flex-wrap: wrap;
    }

    .pill-btn {
      background: var(--card-inner);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 0.4rem 0.85rem;
      border-radius: 20px;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }

    .pill-btn:hover, .pill-btn.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    .search-row {
      display: flex;
      gap: 0.6rem;
      margin-bottom: 1.2rem;
    }

    .search-row input {
      flex: 1;
      background: var(--card-inner);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.65rem 1rem;
      color: #fff;
      font-size: 0.9rem;
      outline: none;
    }
    .search-row input:focus { border-color: var(--accent); }

    .btn-primary {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 0.65rem 1.4rem;
      border-radius: 6px;
      font-weight: 700;
      cursor: pointer;
      font-size: 0.9rem;
      transition: background 0.2s;
    }
    .btn-primary:hover { background: var(--accent-hover); }

    .tmdb-results-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 0.9rem;
      min-height: 280px;
    }

    .tmdb-item-card {
      background: var(--card-inner);
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s, border-color 0.2s;
    }
    .tmdb-item-card:hover {
      transform: translateY(-3px);
      border-color: rgba(255, 255, 255, 0.25);
    }

    .tmdb-item-poster {
      aspect-ratio: 2 / 3;
      width: 100%;
      background: #000;
    }
    .tmdb-item-poster img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .tmdb-item-info {
      padding: 0.5rem;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
      justify-content: space-between;
      gap: 0.4rem;
    }

    .tmdb-item-title {
      font-size: 0.78rem;
      font-weight: 700;
      line-height: 1.2;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .tmdb-item-meta {
      font-size: 0.7rem;
      color: var(--text-muted);
    }

    .btn-inspect {
      background: var(--blue);
      color: #fff;
      border: none;
      padding: 0.35rem 0;
      border-radius: 4px;
      font-size: 0.72rem;
      font-weight: 700;
      cursor: pointer;
      width: 100%;
      text-align: center;
      transition: background 0.2s;
    }
    .btn-inspect:hover { background: #1d4ed8; }

    /* CONTROLES DE PAGINACIÓN */
    .pagination-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 1.2rem;
      padding-top: 0.8rem;
      border-top: 1px solid var(--border);
      font-size: 0.82rem;
      color: var(--text-muted);
    }

    .pagination-btns {
      display: flex;
      gap: 0.5rem;
    }

    .page-btn {
      background: var(--card-inner);
      border: 1px solid var(--border);
      color: #fff;
      padding: 0.35rem 0.85rem;
      border-radius: 4px;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }
    .page-btn:hover:not(:disabled) { background: rgba(255, 255, 255, 0.15); }
    .page-btn:disabled { opacity: 0.35; cursor: not-allowed; }

    /* ENTRADA MANUAL POR URL */
    .manual-box {
      margin-top: 1rem;
      padding-top: 1rem;
      border-top: 1px solid var(--border);
    }
    .manual-box p { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 0.5rem; }

    /* FICHA DE INSPECCIÓN Y PUBLICACIÓN */
    .preview-box {
      background: var(--card-inner);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1.2rem;
      display: none;
    }

    .preview-box.open { display: block; }

    .preview-layout {
      display: grid;
      grid-template-columns: 140px 1fr;
      gap: 1.2rem;
      margin-bottom: 1.2rem;
    }

    .preview-poster {
      border-radius: 6px;
      overflow: hidden;
      aspect-ratio: 2 / 3;
      background: #000;
    }
    .preview-poster img { width: 100%; height: 100%; object-fit: cover; }

    .preview-details h3 { font-size: 1.3rem; margin-bottom: 0.4rem; }
    .preview-details .meta { font-size: 0.82rem; color: var(--text-muted); margin-bottom: 0.6rem; }
    .preview-details p { font-size: 0.82rem; color: #d1d5db; line-height: 1.45; max-height: 80px; overflow-y: auto; margin-bottom: 0.8rem; }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.8rem;
      margin-bottom: 1rem;
    }

    .form-group label { display: block; font-size: 0.72rem; color: var(--text-muted); font-weight: 700; text-transform: uppercase; margin-bottom: 0.3rem; }
    .form-group select, .form-group input {
      width: 100%;
      background: #11141b;
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 0.5rem;
      color: #fff;
      font-size: 0.85rem;
      outline: none;
    }

    .player-test-container {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 6px;
      overflow: hidden;
      margin-bottom: 1rem;
    }
    .player-test-container iframe { width: 100%; height: 100%; border: 0; }

    /* GESTIÓN DE CATÁLOGO PUBLICADO (COLUMNA DERECHA) */
    .published-header-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 0.8rem;
    }

    .badge-count {
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      font-size: 0.75rem;
      font-weight: 800;
      padding: 2px 8px;
      border-radius: 12px;
    }

    .filter-pills-row {
      display: flex;
      gap: 0.4rem;
      margin-bottom: 0.8rem;
    }

    .pub-pill {
      background: var(--card-inner);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 0.3rem 0.75rem;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
    }
    .pub-pill.active {
      background: rgba(255, 255, 255, 0.2);
      color: #fff;
    }

    .pub-search {
      width: 100%;
      background: var(--card-inner);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.6rem 0.9rem;
      color: #fff;
      font-size: 0.85rem;
      outline: none;
      margin-bottom: 1rem;
    }
    .pub-search:focus { border-color: var(--accent); }

    .published-scroll-area {
      height: calc(100vh - 270px);
      min-height: 550px;
      overflow-y: auto;
      padding-right: 0.4rem;
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
    }

    .published-item {
      background: var(--card-inner);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.6rem;
      display: grid;
      grid-template-columns: 50px 1fr auto;
      gap: 0.8rem;
      align-items: center;
      transition: border-color 0.2s;
    }
    .published-item:hover { border-color: rgba(255, 255, 255, 0.2); }

    .pub-thumb {
      width: 50px;
      aspect-ratio: 2 / 3;
      border-radius: 4px;
      object-fit: cover;
      background: #000;
    }

    .pub-info {
      overflow: hidden;
    }

    .pub-title-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.2rem;
    }

    .pub-title {
      font-size: 0.85rem;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .pub-meta {
      font-size: 0.72rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .type-tag {
      font-size: 0.62rem;
      font-weight: 800;
      padding: 1px 5px;
      border-radius: 3px;
      text-transform: uppercase;
      color: #fff;
    }
    .type-tag.pelicula { background: var(--accent); }
    .type-tag.serie { background: var(--blue); }
    .type-tag.anime { background: var(--purple); }

    .pub-actions {
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .pub-quality-select {
      background: #11141b;
      border: 1px solid var(--border);
      color: #fff;
      padding: 0.35rem 0.5rem;
      border-radius: 4px;
      font-size: 0.75rem;
      outline: none;
    }

    .btn-save-row {
      background: var(--blue);
      color: #fff;
      border: none;
      padding: 0.35rem 0.65rem;
      border-radius: 4px;
      font-size: 0.72rem;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-save-row:hover { background: #1d4ed8; }

    .btn-del-row {
      background: rgba(229, 9, 20, 0.15);
      border: 1px solid rgba(229, 9, 20, 0.3);
      color: #ff6b6b;
      padding: 0.35rem 0.65rem;
      border-radius: 4px;
      font-size: 0.72rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-del-row:hover {
      background: var(--accent);
      color: #fff;
    }

    .status-toast {
      position: fixed;
      bottom: 2rem;
      right: 2rem;
      background: #10b981;
      color: #fff;
      padding: 0.8rem 1.4rem;
      border-radius: 6px;
      font-size: 0.88rem;
      font-weight: 700;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      display: none;
      z-index: 1000;
    }
  </style>
</head>
<body>

  <div class="admin-wrapper">
    <!-- HEADER -->
    <header class="admin-header">
      <div class="admin-title">
        <h1>⚙️ BigScreen Studio</h1>
        <p>Centro de Control y Publicación Directa en GitHub Pages</p>
      </div>
      <div>
        <button class="btn-config" id="btn-toggle-config">🔑 Configuración de Acceso</button>
      </div>
    </header>

    <!-- PANEL CREDENCIALES (DESPLEGABLE) -->
    <section class="config-panel" id="config-panel">
      <div class="config-group">
        <label>GitHub Personal Access Token (PAT):</label>
        <input type="password" id="gh-token" placeholder="ghp_xxxxxxxxxxxx">
      </div>
      <div class="config-group">
        <label>Usuario / Dueño del Repo:</label>
        <input type="text" id="gh-owner" value="Mangadake">
      </div>
      <div class="config-group">
        <label>Nombre del Repositorio:</label>
        <input type="text" id="gh-repo" value="bigscreen-T1">
      </div>
      <div class="config-group">
        <label>Ruta del Catálogo:</label>
        <input type="text" id="gh-path" value="catalogo.json">
      </div>
      <div class="config-group">
        <label>TMDb API Key (v3):</label>
        <input type="text" id="tmdb-key" placeholder="Pega tu API Key de TMDB">
      </div>
      <div style="display: flex; align-items: flex-end;">
        <button class="btn-primary" id="btn-save-credentials" style="width: 100%;">Guardar Llaves</button>
      </div>
    </section>

    <!-- WORKSPACE 2 COLUMNAS (1440p) -->
    <main class="dashboard-grid">
      <!-- COLUMNA IZQUIERDA: DESCUBRIR Y PUBLICAR -->
      <section>
        <div class="panel-card">
          <div class="panel-card-header">
            <h2 class="panel-card-title">🔍 Explorador de Contenido TMDb</h2>
            <div class="tmdb-nav-pills">
              <button class="pill-btn active" data-type="trending">Tendencias</button>
              <button class="pill-btn" data-type="movies">Películas</button>
              <button class="pill-btn" data-type="tv">Series</button>
              <button class="pill-btn" data-type="anime">Anime</button>
            </div>
          </div>

          <div class="search-row">
            <input type="text" id="tmdb-search-input" placeholder="Buscar por título (ej: Batman, Dune, Shingeki)...">
            <button class="btn-primary" id="btn-tmdb-search">Buscar</button>
          </div>

          <div class="tmdb-results-grid" id="tmdb-grid">
            <!-- Portadas dinámicas -->
          </div>

          <!-- PAGINACIÓN ILIMITADA -->
          <div class="pagination-bar">
            <span id="page-indicator">Página 1</span>
            <div class="pagination-btns">
              <button class="page-btn" id="btn-page-prev" disabled>◀ Anterior</button>
              <button class="page-btn" id="btn-page-next">Siguiente ▶</button>
            </div>
          </div>

          <!-- IMPORTACIÓN MANUAL -->
          <div class="manual-box">
            <p>O importa cualquier URL directamente de TMDb:</p>
            <div class="search-row" style="margin-bottom: 0;">
              <input type="text" id="manual-url" placeholder="https://www.themoviedb.org/movie/114...">
              <button class="btn-primary" id="btn-manual-fetch">Analizar</button>
            </div>
          </div>
        </div>

        <!-- FICHA DE INSPECCIÓN Y PUBLICACIÓN -->
        <div class="panel-card preview-box" id="preview-box">
          <h2 class="panel-card-title" style="margin-bottom: 1rem;">📺 Inspección y Publicación</h2>
          
          <div class="preview-layout">
            <div class="preview-poster">
              <img id="prev-poster" src="" alt="Poster">
            </div>
            <div class="preview-details">
              <h3 id="prev-title">Título</h3>
              <div class="meta" id="prev-meta">Tipo • Año • Rating</div>
              <p id="prev-synopsis">Sinopsis...</p>

              <div class="form-row">
                <div class="form-group">
                  <label>Tipo de Contenido:</label>
                  <select id="prev-type-select">
                    <option value="pelicula">PELÍCULA</option>
                    <option value="serie">SERIE</option>
                    <option value="anime">ANIME</option>
                  </select>
                </div>
                <div class="form-group">
                  <label>Calidad del Video:</label>
                  <select id="prev-quality-select">
                    <option value="">Ninguna (Normal)</option>
                    <option value="CAM">CAM (Naranja)</option>
                    <option value="720p">720p (Azul)</option>
                    <option value="1080p" selected>1080p (Verde)</option>
                    <option value="4K">4K (Púrpura)</option>
                  </select>
                </div>
              </div>
            </div>
          </div>

          <div class="form-group" style="margin-bottom: 0.6rem;">
            <label>Comprobación en Vivo del Reproductor:</label>
          </div>
          <div class="player-test-container">
            <iframe id="prev-player-iframe" src="" allowfullscreen></iframe>
          </div>

          <button class="btn-primary" id="btn-publish" style="width: 100%; padding: 0.9rem; font-size: 1rem;">
            🚀 Publicar en el Catálogo de BigScreen
          </button>
        </div>
      </section>

      <!-- COLUMNA DERECHA: GESTIÓN DE TÍTULOS PUBLICADOS -->
      <section>
        <div class="panel-card">
          <div class="published-header-bar">
            <h2 class="panel-card-title">
              📚 Títulos Publicados
              <span class="badge-count" id="published-counter">0 títulos</span>
            </h2>
            <button class="btn-config" id="btn-refresh-catalog" style="padding: 0.3rem 0.6rem; font-size: 0.75rem;">🔄 Refrescar</button>
          </div>

          <div class="filter-pills-row">
            <button class="pub-pill active" data-filter="all">Todos</button>
            <button class="pub-pill" data-filter="pelicula">Películas</button>
            <button class="pub-pill" data-filter="serie">Series</button>
            <button class="pub-pill" data-filter="anime">Anime</button>
          </div>

          <input type="text" class="pub-search" id="pub-search-input" placeholder="🔍 Filtrar título al instante por nombre...">

          <div class="published-scroll-area" id="published-list">
            <!-- Lista interactiva de títulos -->
          </div>
        </div>
      </section>
    </main>
  </div>

  <div class="status-toast" id="toast">Acción completada con éxito</div>

  <script>
    // ESTADO GLOBAL
    let publishedCatalog = [];
    let currentCatalogSha = null;
    let inspectingItem = null;
    let currentTmdbPage = 1;
    let currentTmdbCategory = 'trending';
    let currentPublishedFilter = 'all';

    // ELEMENTOS DEL DOM
    const tmdbGrid = document.getElementById("tmdb-grid");
    const tmdbSearchInput = document.getElementById("tmdb-search-input");
    const pageIndicator = document.getElementById("page-indicator");
    const btnPagePrev = document.getElementById("btn-page-prev");
    const btnPageNext = document.getElementById("btn-page-next");
    const previewBox = document.getElementById("preview-box");
    const publishedList = document.getElementById("published-list");
    const pubSearchInput = document.getElementById("pub-search-input");
    const publishedCounter = document.getElementById("published-counter");
    const toast = document.getElementById("toast");

    // CREDENCIALES
    function cargarCredenciales() {
      document.getElementById("gh-token").value = localStorage.getItem("gh_token") || "";
      document.getElementById("gh-owner").value = localStorage.getItem("gh_owner") || "Mangadake";
      document.getElementById("gh-repo").value = localStorage.getItem("gh_repo") || "bigscreen-T1";
      document.getElementById("gh-path").value = localStorage.getItem("gh_path") || "catalogo.json";
      document.getElementById("tmdb-key").value = localStorage.getItem("tmdb_key") || "";
    }

    document.getElementById("btn-save-credentials").addEventListener("click", () => {
      localStorage.setItem("gh_token", document.getElementById("gh-token").value.trim());
      localStorage.setItem("gh_owner", document.getElementById("gh-owner").value.trim());
      localStorage.setItem("gh_repo", document.getElementById("gh-repo").value.trim());
      localStorage.setItem("gh_path", document.getElementById("gh-path").value.trim());
      localStorage.setItem("tmdb_key", document.getElementById("tmdb-key").value.trim());
      showToast("Configuración guardada correctamente");
      cargarExploradorTMDb();
      cargarCatalogoRemoto();
    });

    document.getElementById("btn-toggle-config").addEventListener("click", () => {
      document.getElementById("config-panel").classList.toggle("open");
    });

    function showToast(msg) {
      toast.innerText = msg;
      toast.style.display = "block";
      setTimeout(() => { toast.style.display = "none"; }, 3500);
    }

    // EXPLORADOR TMDB CON PAGINACIÓN
    async function cargarExploradorTMDb() {
      const tmdbKey = localStorage.getItem("tmdb_key");
      if (!tmdbKey) {
        tmdbGrid.innerHTML = `<p style="grid-column: 1/-1; color: var(--text-muted); padding: 2rem; text-align: center;">Configura tu TMDb API Key arriba para explorar contenidos.</p>`;
        return;
      }

      tmdbGrid.innerHTML = `<p style="grid-column: 1/-1; color: var(--text-muted); padding: 2rem; text-align: center;">Consultando TMDb...</p>`;

      let url = "";
      const query = tmdbSearchInput.value.trim();

      if (query) {
        url = `https://api.themoviedb.org/3/search/multi?api_key=${tmdbKey}&language=es-MX&query=${encodeURIComponent(query)}&page=${currentTmdbPage}`;
      } else {
        if (currentTmdbCategory === 'trending') {
          url = `https://api.themoviedb.org/3/trending/all/week?api_key=${tmdbKey}&language=es-MX&page=${currentTmdbPage}`;
        } else if (currentTmdbCategory === 'movies') {
          url = `https://api.themoviedb.org/3/movie/popular?api_key=${tmdbKey}&language=es-MX&page=${currentTmdbPage}`;
        } else if (currentTmdbCategory === 'tv') {
          url = `https://api.themoviedb.org/3/tv/popular?api_key=${tmdbKey}&language=es-MX&page=${currentTmdbPage}`;
        } else if (currentTmdbCategory === 'anime') {
          url = `https://api.themoviedb.org/3/discover/tv?api_key=${tmdbKey}&language=es-MX&with_genres=16&page=${currentTmdbPage}`;
        }
      }

      try {
        const res = await fetch(url);
        const data = await res.json();
        const results = (data.results || []).filter(item => item.poster_path);

        pageIndicator.innerText = `Página ${data.page || 1} de ${data.total_pages || 1}`;
        btnPagePrev.disabled = currentTmdbPage <= 1;
        btnPageNext.disabled = currentTmdbPage >= (data.total_pages || 1);

        if (results.length === 0) {
          tmdbGrid.innerHTML = `<p style="grid-column: 1/-1; color: var(--text-muted); padding: 2rem; text-align: center;">No se encontraron resultados.</p>`;
          return;
        }

        tmdbGrid.innerHTML = results.map(item => {
          const title = item.title || item.name || "Sin título";
          const date = item.release_date || item.first_air_date || "";
          const year = date ? date.substring(0, 4) : "N/A";
          const isMovie = item.media_type === "movie" || (!item.media_type && currentTmdbCategory === 'movies');
          const type = isMovie ? "pelicula" : (currentTmdbCategory === 'anime' ? "anime" : "serie");
          const poster = `https://image.tmdb.org/t/p/w342${item.poster_path}`;

          return `
            <div class="tmdb-item-card">
              <div class="tmdb-item-poster">
                <img src="${poster}" alt="${title}" loading="lazy">
              </div>
              <div class="tmdb-item-info">
                <div>
                  <div class="tmdb-item-title" title="${title}">${title}</div>
                  <div class="tmdb-item-meta">${type.toUpperCase()} • ${year}</div>
                </div>
                <button class="btn-inspect" onclick="prepararInspeccion('${type}', ${item.id})">Inspeccionar</button>
              </div>
            </div>
          `;
        }).join("");

      } catch (err) {
        console.error(err);
        tmdbGrid.innerHTML = `<p style="grid-column: 1/-1; color: var(--accent); padding: 2rem; text-align: center;">Error al conectar con TMDb.</p>`;
      }
    }

    // Pestañas de categoría
    document.querySelectorAll(".pill-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".pill-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        currentTmdbCategory = btn.dataset.type;
        currentTmdbPage = 1;
        tmdbSearchInput.value = "";
        cargarExploradorTMDb();
      });
    });

    document.getElementById("btn-tmdb-search").addEventListener("click", () => {
      currentTmdbPage = 1;
      cargarExploradorTMDb();
    });

    tmdbSearchInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        currentTmdbPage = 1;
        cargarExploradorTMDb();
      }
    });

    btnPagePrev.addEventListener("click", () => {
      if (currentTmdbPage > 1) {
        currentTmdbPage--;
        cargarExploradorTMDb();
      }
    });

    btnPageNext.addEventListener("click", () => {
      currentTmdbPage++;
      cargarExploradorTMDb();
    });

    // INSPECCIÓN Y CARGA DE DETALLES
    window.prepararInspeccion = async function(type, tmdbId) {
      const tmdbKey = localStorage.getItem("tmdb_key");
      const isMovie = (type === "pelicula");
      const endpoint = isMovie ? "movie" : "tv";

      try {
        const res = await fetch(`https://api.themoviedb.org/3/${endpoint}/${tmdbId}?api_key=${tmdbKey}&language=es-MX`);
        const data = await res.json();

        const title = data.title || data.name;
        const date = data.release_date || data.first_air_date || "";
        const year = date ? parseInt(date.substring(0, 4)) : new Date().getFullYear();
        const duration = isMovie ? (data.runtime ? `${data.runtime} min` : "120 min") : null;
        const episodes = !isMovie ? (data.number_of_episodes || 12) : null;
        const rating = data.vote_average ? parseFloat(data.vote_average.toFixed(1)) : 8.0;

        let seasonsDetail = [];
        if (!isMovie && Array.isArray(data.seasons)) {
          seasonsDetail = data.seasons
            .filter(s => s.season_number > 0 && s.episode_count > 0)
            .map(s => ({
              season_number: s.season_number,
              name: s.name,
              episode_count: s.episode_count
            }));
        }

        inspectingItem = {
          id: Date.now(),
          tmdb_id: tmdbId,
          type: type,
          title: title,
          year: year,
          duration: duration,
          episodes: episodes,
          rating: rating,
          synopsis: data.overview || "Sin descripción disponible.",
          poster: `https://image.tmdb.org/t/p/w500${data.poster_path}`,
          backdrop: `https://image.tmdb.org/t/p/original${data.backdrop_path || data.poster_path}`,
          quality: "1080p",
          seasons_detail: seasonsDetail
        };

        // Pintar en el DOM
        document.getElementById("prev-poster").src = inspectingItem.poster;
        document.getElementById("prev-title").innerText = inspectingItem.title;
        document.getElementById("prev-meta").innerText = `${type.toUpperCase()} • ${year} • ★ ${rating}`;
        document.getElementById("prev-synopsis").innerText = inspectingItem.synopsis;
        document.getElementById("prev-type-select").value = type;
        document.getElementById("prev-quality-select").value = "1080p";

        // Reproductor de prueba (Unlimplay)
        const embedUrl = isMovie 
          ? `https://unlimplay.com/f/embed/movie/${tmdbId}`
          : `https://unlimplay.com/f/embed/tv/${tmdbId}/1/1`;
        document.getElementById("prev-player-iframe").src = embedUrl;

        previewBox.classList.add("open");
        previewBox.scrollIntoView({ behavior: 'smooth' });

      } catch (err) {
        console.error(err);
        alert("Error al cargar la ficha del título.");
      }
    };

    // PUBLICAR EN GITHUB
    document.getElementById("btn-publish").addEventListener("click", async () => {
      if (!inspectingItem) return;

      const ghToken = localStorage.getItem("gh_token");
      const ghOwner = localStorage.getItem("gh_owner");
      const ghRepo = localStorage.getItem("gh_repo");
      const ghPath = localStorage.getItem("gh_path");

      if (!ghToken) {
        alert("Por favor abre 'Configuración de Acceso' y guarda tu GitHub Personal Access Token.");
        return;
      }

      inspectingItem.type = document.getElementById("prev-type-select").value;
      inspectingItem.quality = document.getElementById("prev-quality-select").value;

      // Evitar duplicados por TMDB ID
      const yaExiste = publishedCatalog.some(i => i.tmdb_id === inspectingItem.tmdb_id);
      if (yaExiste) {
        alert("Este título ya se encuentra en tu catálogo.");
        return;
      }

      // Añadir al inicio
      const nuevoCatalogo = [inspectingItem, ...publishedCatalog];

      try {
        const url = `https://api.github.com/repos/${ghOwner}/${ghRepo}/contents/${ghPath}`;
        const bodyData = {
          message: `Publicar "${inspectingItem.title}" [BigScreen Studio]`,
          content: btoa(unescape(encodeURIComponent(JSON.stringify(nuevoCatalogo, null, 2)))),
          sha: currentCatalogSha
        };

        const res = await fetch(url, {
          method: "PUT",
          headers: {
            "Authorization": `token ${ghToken}`,
            "Content-Type": "application/json"
          },
          body: JSON.stringify(bodyData)
        });

        if (!res.ok) throw new Error("Error en GitHub API al guardar");

        showToast(`"${inspectingItem.title}" publicado con éxito`);
        previewBox.classList.remove("open");
        inspectingItem = null;
        cargarCatalogoRemoto();

      } catch (err) {
        console.error(err);
        alert("Hubo un fallo al subir el cambio a GitHub. Revisa tus credenciales.");
      }
    });

    // IMPORTACIÓN MANUAL
    document.getElementById("btn-manual-fetch").addEventListener("click", () => {
      const url = document.getElementById("manual-url").value.trim();
      const match = url.match(/themoviedb\.org\/(movie|tv)\/(\d+)/);
      if (!match) {
        alert("Ingresa una URL válida de TMDb, ej: https://www.themoviedb.org/movie/550");
        return;
      }
      const type = (match[1] === "movie") ? "pelicula" : "serie";
      const id = parseInt(match[2]);
      prepararInspeccion(type, id);
    });

    // CARGAR CATÁLOGO PUBLICADO DESDE GITHUB
    async function cargarCatalogoRemoto() {
      const ghOwner = localStorage.getItem("gh_owner") || "Mangadake";
      const ghRepo = localStorage.getItem("gh_repo") || "bigscreen-T1";
      const ghPath = localStorage.getItem("gh_path") || "catalogo.json";
      const ghToken = localStorage.getItem("gh_token");

      const headers = ghToken ? { "Authorization": `token ${ghToken}` } : {};

      try {
        const res = await fetch(`https://api.github.com/repos/${ghOwner}/${ghRepo}/contents/${ghPath}?t=${Date.now()}`, { headers });
        if (!res.ok) throw new Error("No se pudo leer catalogo.json");

        const data = await res.json();
        currentCatalogSha = data.sha;
        const decoded = decodeURIComponent(escape(atob(data.content)));
        publishedCatalog = JSON.parse(decoded);

        renderPublishedList();
      } catch (err) {
        console.error(err);
        publishedList.innerHTML = `<p style="color: var(--text-muted); text-align: center; padding: 2rem;">No se pudo conectar con el catálogo en GitHub.</p>`;
      }
    }

    // RENDERIZADO Y BÚSQUEDA INSTANTÁNEA EN CATÁLOGO PUBLICADO
    function renderPublishedList() {
      const q = pubSearchInput.value.toLowerCase().trim();

      const itemsFiltrados = publishedCatalog.filter(item => {
        const coincideTipo = (currentPublishedFilter === 'all') || (item.type === currentPublishedFilter);
        const coincideTexto = item.title.toLowerCase().includes(q);
        return coincideTipo && coincideTexto;
      });

      publishedCounter.innerText = `${publishedCatalog.length} títulos`;

      if (itemsFiltrados.length === 0) {
        publishedList.innerHTML = `<p style="color: var(--text-muted); text-align: center; padding: 2rem;">No hay títulos que coincidan con la búsqueda.</p>`;
        return;
      }

      publishedList.innerHTML = itemsFiltrados.map(item => {
        const qualityVal = item.quality || "";
        return `
          <div class="published-item">
            <img class="pub-thumb" src="${item.poster}" alt="${item.title}" loading="lazy">
            <div class="pub-info">
              <div class="pub-title-row">
                <span class="type-tag ${item.type}">${item.type === 'pelicula' ? 'PELÍCULA' : item.type.toUpperCase()}</span>
                <span class="pub-title" title="${item.title}">${item.title}</span>
              </div>
              <div class="pub-meta">
                <span>★ ${item.rating}</span>
                <span>• ${item.year}</span>
              </div>
            </div>
            <div class="pub-actions">
              <select class="pub-quality-select" id="pub-q-${item.id}">
                <option value="" ${qualityVal === "" ? "selected" : ""}>Ninguna</option>
                <option value="CAM" ${qualityVal === "CAM" ? "selected" : ""}>CAM</option>
                <option value="720p" ${qualityVal === "720p" ? "selected" : ""}>720p</option>
                <option value="1080p" ${qualityVal === "1080p" ? "selected" : ""}>1080p</option>
                <option value="4K" ${qualityVal === "4K" ? "selected" : ""}>4K</option>
              </select>
              <button class="btn-save-row" onclick="actualizarCalidadItem(${item.id})">Guardar</button>
              <button class="btn-del-row" onclick="eliminarItem(${item.id})">Eliminar</button>
            </div>
          </div>
        `;
      }).join("");
    }

    // Buscador instantáneo al escribir
    pubSearchInput.addEventListener("input", renderPublishedList);

    // Filtros por píldoras en publicados
    document.querySelectorAll(".pub-pill").forEach(pill => {
      pill.addEventListener("click", () => {
        document.querySelectorAll(".pub-pill").forEach(p => p.classList.remove("active"));
        pill.classList.add("active");
        currentPublishedFilter = pill.dataset.filter;
        renderPublishedList();
      });
    });

    // Guardar calidad modificada
    window.actualizarCalidadItem = async function(id) {
      const select = document.getElementById(`pub-q-${id}`);
      const nuevaCalidad = select.value;

      const item = publishedCatalog.find(i => i.id === id);
      if (!item) return;

      item.quality = nuevaCalidad;
      await guardarCatalogoGithub(`Actualizar calidad de "${item.title}" a ${nuevaCalidad || 'normal'}`);
    };

    // Eliminar título
    window.eliminarItem = async function(id) {
      const item = publishedCatalog.find(i => i.id === id);
      if (!item) return;

      if (!confirm(`¿Estás seguro de eliminar "${item.title}" de tu web?`)) return;

      publishedCatalog = publishedCatalog.filter(i => i.id !== id);
      await guardarCatalogoGithub(`Eliminar "${item.title}" [BigScreen Studio]`);
    };

    // Guardar array en GitHub
    async function guardarCatalogoGithub(commitMsg) {
      const ghToken = localStorage.getItem("gh_token");
      const ghOwner = localStorage.getItem("gh_owner");
      const ghRepo = localStorage.getItem("gh_repo");
      const ghPath = localStorage.getItem("gh_path");

      try {
        const url = `https://api.github.com/repos/${ghOwner}/${ghRepo}/contents/${ghPath}`;
        const bodyData = {
          message: commitMsg,
          content: btoa(unescape(encodeURIComponent(JSON.stringify(publishedCatalog, null, 2)))),
          sha: currentCatalogSha
        };

        const res = await fetch(url, {
          method: "PUT",
          headers: {
            "Authorization": `token ${ghToken}`,
            "Content-Type": "application/json"
          },
          body: JSON.stringify(bodyData)
        });

        if (!res.ok) throw new Error("Fallo al guardar en GitHub");

        showToast("Cambio guardado en el repositorio");
        cargarCatalogoRemoto();
      } catch (err) {
        console.error(err);
        alert("Error al sincronizar con GitHub.");
      }
    }

    document.getElementById("btn-refresh-catalog").addEventListener("click", cargarCatalogoRemoto);

    // INICIO AUTOMÁTICO
    cargarCredenciales();
    cargarExploradorTMDb();
    cargarCatalogoRemoto();
  </script>
</body>
</html>
